<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>和奥堂 - 服务广场审核稿</title>
    <link rel="stylesheet" href="./service-page.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="和奥堂服务广场">
      <section class="phone">
        <header class="topbar">
          <div class="brand-title">
            <img class="brand-mark" src="./assets/heaotang-logo.svg" alt="和奥堂商标" />
            <h1>服务广场</h1>
          </div>
          <button class="ai-button" type="button" aria-label="页面AI助手">
            AI
          </button>
        </header>

        <section class="content">
          <article class="hero-entry life-entry">
            <div class="entry-icon life-mark" aria-hidden="true">导</div>
            <div class="entry-copy">
              <p class="section-kicker">核心服务</p>
              <h2>生命导航</h2>
            </div>
            <span class="entry-action">进入</span>
          </article>

          <article class="club-panel">
            <div class="club-grid" aria-label="俱乐部联盟体系">
              <button type="button">俱乐部联盟</button>
              <button type="button">管理中心</button>
              <button type="button">公益俱乐部</button>
              <button type="button">自建俱乐部</button>
              <button type="button">家庭俱乐部</button>
              <button type="button">俱乐部友联体</button>
            </div>
          </article>

          <article class="hero-entry health-entry">
            <div class="entry-icon health-mark health-word" aria-hidden="true">健康</div>
            <div class="entry-copy">
              <p class="section-kicker">核心服务</p>
              <h2>健康大管家</h2>
            </div>
            <span class="entry-action">进入</span>
          </article>

          <section class="services-panel" aria-labelledby="service-tools-title">
            <div class="panel-heading compact">
              <div>
                <h2 id="service-tools-title">常用服务</h2>
              </div>
              <button class="more-button" type="button">更多</button>
            </div>
            <div class="service-grid">
              <button class="service-tile" type="button">
                <span class="tile-icon activity-icon" aria-hidden="true"></span>
                <strong>活动广场</strong>
              </button>
              <button class="service-tile" type="button">
                <span class="tile-icon network-icon" aria-hidden="true"></span>
                <strong>人脉中心</strong>
              </button>
              <button class="service-tile" type="button">
                <span class="tile-icon mall-icon" aria-hidden="true"></span>
                <strong>保障商城</strong>
              </button>
              <button class="service-tile" type="button">
                <span class="tile-icon market-icon" aria-hidden="true"></span>
                <strong>二手集市</strong>
              </button>
              <button class="service-tile" type="button">
                <span class="tile-icon ai-tile-icon" aria-hidden="true">AI</span>
                <strong>AI</strong>
              </button>
              <button class="service-tile" type="button">
                <span class="tile-icon study-icon" aria-hidden="true"></span>
                <strong>学习广场</strong>
              </button>
            </div>
          </section>
        </section>

        <nav class="tabbar" aria-label="主导航">
          <button type="button">
            <span class="tab-icon home-icon" aria-hidden="true"></span>
            首页
          </button>
          <button class="active" type="button" aria-current="page">
            <span class="tab-icon service-icon" aria-hidden="true"></span>
            服务
          </button>
          <button type="button">
            <span class="tab-icon discover-icon" aria-hidden="true"></span>
            发现
          </button>
          <button type="button">
            <span class="tab-icon mine-icon" aria-hidden="true"></span>
            我的
          </button>
        </nav>
      </section>
    </main>
  </body>
</html>
